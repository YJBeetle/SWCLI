[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "swcli"
version = "0.1.0.dev0"
description = "Cross-platform automation protocol, CLI, and agent runtime for SOLIDWORKS"
readme = "README.md"
requires-python = ">=3.9"
authors = [
  { name = "YJBeetle" },
]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Environment :: Console",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
]

[project.optional-dependencies]
windows = [
  "pywin32>=312; sys_platform == 'win32'",
]

[project.scripts]
sw-cli = "swcli.cli:main"
swclid = "swcli.daemon:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
swcli = ["schemas/**/*.json"]
