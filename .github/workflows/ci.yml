name: CI

on:
  push:
    branches: ["**"]
    tags: ["v*"]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.gitignore'
      - 'LICENSE'
  workflow_dispatch:
    inputs:
      dimension_format_public:
        description: Run installed public dimension display acceptance after internal proof
        type: boolean
        required: false
        default: false
      dimension_format_calibration:
        description: Run only branch-owned dimension display internal calibration
        type: boolean
        required: false
        default: false
      media_path:
        description: Google Drive path to the SOLIDWORKS ISO
        required: true
        default: Share/Software/DS.SolidWorks.2025.SP5.0.Premium-SSQ/SolidWorks.2025.SP5.0.Premium.DVD.iso
        type: string
      assets_path:
        description: Google Drive path to the private test runtime overlay
        required: true
        default: Share/Software/DS.SolidWorks.2025.SP5.0.Premium-SSQ/crack
        type: string
      cleanup_profile:
        description: Disk cleanup level
        required: true
        default: auto
        type: choice
        options:
          - auto
          - conservative
          - aggressive
      vfs_cache_gib:
        description: Maximum local rclone VFS cache size
        required: true
        default: "8"
        type: choice
        options:
          - "6"
          - "8"
          - "12"
      detailing_public_gate:
        description: Run only public drawing-default CLI/daemon acceptance on codex/docprops-detailing
        required: false
        default: false
        type: boolean
      detailing_calibration:
        description: Run only internal drawing-default calibration on codex/docprops-detailing
        required: false
        default: false
        type: boolean
      native_revolve_public:
        description: Bounded revolve public CLI/daemon acceptance on codex/swcli-revolve-feature only
        required: false
        default: false
        type: boolean
      native_revolve_calibration:
        description: Internal bounded revolve calibration on codex/swcli-revolve-feature only (not public acceptance)
        required: false
        default: false
        type: boolean
      accept_tolerances:
        description: Public document tolerance acceptance (codex/docprops-tolerances only)
        required: false
        default: false
        type: boolean
      calibrate_tolerances:
        description: Internal document tolerance calibration (codex/docprops-tolerances only)
        required: false
        default: false
        type: boolean
      calibrate_font_scopes:
        description: Run only codex/docprops-font-scopes internal native calibration
        required: false
        default: false
        type: boolean
      font_scopes_profile:
        description: Font-only profile (public-notes requires prior reviewed native evidence)
        type: choice
        required: false
        default: internal
        options: [internal, public-notes]
      stl_options_public:
        description: Run bounded public STL CLI SDK MCP acceptance on an explicitly isolated runner
        required: false
        default: false
        type: boolean
      stl_options_targeted:
        description: Run isolated STL options calibration only (branch-scoped, no public acceptance)
        required: false
        default: false
        type: boolean
      line_font_public:
        description: Public CLI drawing Line Font acceptance (branch only)
        required: false
        default: false
        type: boolean
      line_font_calibration:
        description: Internal drawing line font calibration (branch only, no public acceptance)
        required: false
        default: false
        type: boolean
      native_topology_targeted:
        description: Run only bounded topology reference calibration on its development branch
        required: false
        default: false
        type: boolean
      native_full:
        description: Run complete installed SOLIDWORKS functional verification
        required: false
        default: false
        type: boolean
      image_quality_calibration:
        description: Internal image-quality/GLB calibration on codex/docprops-export-options only (exclusive with native_full)
        required: false
        default: false
        type: boolean
      image_quality_public_acceptance:
        description: Public document image-quality acceptance on codex/docprops-export-options only (exclusive with other native selections)
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  native-profile:
    name: Validate native scope before runtime access
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      profile: ${{ steps.resolve.outputs.profile }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Reject mixed scopes and incorrect feature branches
        id: resolve
        env:
          SWCLI_NATIVE_INPUTS: ${{ toJSON(inputs) }}
        run: python scripts/ci/validate-native-profile.py

  dispatch-policy:
    needs: [native-profile]
    name: Reject invalid or conflicting manual CI profiles
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      validation_profile: ${{ steps.selection.outputs.validation_profile }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Select one legal validation route
        id: selection
        env:
          SWCLI_FONT_VALIDATION: ${{ inputs.calibrate_font_scopes || false }}
          SWCLI_NATIVE_FULL: ${{ inputs.native_full || false }}
          SWCLI_FONT_PROFILE: ${{ inputs.font_scopes_profile || 'internal' }}
        run: python scripts/ci/validate-ci-dispatch.py

  tag-policy:
    name: Validate release tag before private native runtime
    if: ${{ github.repository == 'YJBeetle/SWCLI' && github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && !github.event.deleted }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Execute the policy from main, not from an untrusted tag target.
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Require version match and main ancestry
        run: python scripts/ci/tag-release.py check-tag

  test:
    needs: [native-profile, dispatch-policy]
    if: ${{ needs.dispatch-policy.outputs.validation_profile == 'standard' && !(github.event_name == 'workflow_dispatch' && (inputs.detailing_calibration || inputs.detailing_public_gate || inputs.dimension_format_calibration || inputs.dimension_format_public)) }}
    name: Windows / Python ${{ matrix.python }}
    runs-on: windows-2025
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ["3.9", "3.14"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: Reject invalid native route combinations before private runtime
        env:
          SWCLI_ROUTE_FULL: ${{ inputs.native_full || false }}
          SWCLI_ROUTE_LINE_FONT_INTERNAL: ${{ inputs.line_font_calibration || false }}
          SWCLI_ROUTE_LINE_FONT_PUBLIC: ${{ inputs.line_font_public || false }}
        run: python scripts/ci/validate-line-font-route.py

      - name: Install SWCLI
        id: portable_install
        shell: powershell
        run: |
          python -m pip install --upgrade pip
          python -m pip install "PyYAML>=6,<7"
          if ($LASTEXITCODE -ne 0) { throw "Portable workflow checks require PyYAML" }
          if ("${{ matrix.python }}" -eq "3.14") {
            python -m pip install --editable ".[mcp]"
          } else {
            python -m pip install --editable .
          }

      - name: Run unit tests
        id: unit_tests
        run: python -m unittest discover -s tests -v

      - name: Verify typed Python SDK
        id: sdk_types
        if: ${{ matrix.python == '3.14' }}
        run: |
          python -m pip install "mypy>=1.15,<2"
          python scripts/ci/verify-sdk-types.py

      - name: Parse Windows CI scripts
        id: script_parser
        if: ${{ matrix.python == '3.14' }}
        shell: powershell
        run: |
          $failed = $false
          Get-ChildItem scripts/ci/windows, examples -Filter *.ps1 | ForEach-Object {
            $tokens = $null
            $errors = $null
            [Management.Automation.Language.Parser]::ParseFile(
              $_.FullName,
              [ref]$tokens,
              [ref]$errors
            ) | Out-Null
            if ($errors.Count -gt 0) {
              $failed = $true
              $errors | ForEach-Object {
                Write-Error "$($_.Extent.File):$($_.Extent.StartLineNumber): $($_.Message)"
              }
            }
          }
          if ($failed) { throw "PowerShell parser rejected one or more Windows CI scripts" }

      - name: Verify installed commands and schemas
        id: portable_resources
        shell: powershell
        run: |
          swcli version --json
          if ($LASTEXITCODE -ne 0) { throw "SWCLI entry point failed" }
          python scripts/ci/verify-installed.py

      - name: Summarize portable checks
        if: always()
        continue-on-error: true
        shell: powershell
        run: |
          $clientVersion = python -c "import sys; sys.path.insert(0, 'src'); import swcli; print(swcli.__version__)"
          python scripts/ci/summarize-tests.py `
            --evidence-root "$env:RUNNER_TEMP\swcli-portable-no-cad-evidence" `
            --output-dir "$env:RUNNER_TEMP\swcli-portable-summary" `
            --host windows --scope "portable-checks-python-${{ matrix.python }}" `
            --source-commit "$env:GITHUB_SHA" --client-version "$clientVersion" `
            --stage "install=${{ steps.portable_install.outcome }}" `
            --stage "unit-tests=${{ steps.unit_tests.outcome }}" `
            --stage "sdk-types=${{ steps.sdk_types.outcome }}" `
            --stage "script-parser=${{ steps.script_parser.outcome }}" `
            --stage "installed-resources=${{ steps.portable_resources.outcome }}"

      - name: Upload portable summary
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: swcli-portable-summary-${{ matrix.python }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/swcli-portable-summary/
          if-no-files-found: ignore
          retention-days: 14

  package:
    needs: [native-profile, dispatch-policy]
    if: ${{ needs.dispatch-policy.outputs.validation_profile == 'standard' && !(github.event_name == 'workflow_dispatch' && (inputs.detailing_calibration || inputs.detailing_public_gate || inputs.dimension_format_calibration || inputs.dimension_format_public)) }}
    name: Build wheel
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip

      - name: Build and inspect distributions
        id: build_distributions
        shell: bash
        run: |
          set -Eeuo pipefail
          python -m pip install --upgrade build twine
          python -m build
          python -m twine check dist/*
          python scripts/ci/verify-sdist.py dist/*.tar.gz

      - name: Verify installed wheel and product skill
        id: verify_distribution
        shell: bash
        run: |
          set -Eeuo pipefail
          python -m pip install dist/*.whl
          python -I scripts/ci/verify-installed.py

      - name: Upload distributions
        id: upload_distributions
        uses: actions/upload-artifact@v7
        with:
          name: swcli-dist
          path: dist/
          if-no-files-found: error
          retention-days: 14

      - name: Summarize package checks
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          client_version="$(python -c "import sys; sys.path.insert(0, 'src'); import swcli; print(swcli.__version__)")"
          python scripts/ci/summarize-tests.py \
            --evidence-root "$RUNNER_TEMP/swcli-package-no-cad-evidence" \
            --output-dir "$RUNNER_TEMP/swcli-package-summary" \
            --host linux-wine --scope portable-package \
            --source-commit "$GITHUB_SHA" --client-version "$client_version" \
            --stage "build=${{ steps.build_distributions.outcome }}" \
            --stage "installed-resources=${{ steps.verify_distribution.outcome }}" \
            --stage "distribution-upload=${{ steps.upload_distributions.outcome }}"

      - name: Upload package summary separately from original distributions
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: swcli-package-summary-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/swcli-package-summary/
          if-no-files-found: ignore
          retention-days: 14

  solidworks-e2e:
    name: ${{ inputs.native_topology_targeted && 'Targeted topology reference verification' || inputs.image_quality_public_acceptance && 'Public document Image Quality acceptance' || inputs.image_quality_calibration && 'Internal Image Quality GLB calibration' || inputs.line_font_public && 'Public drawing Line Font acceptance' || inputs.line_font_calibration && 'Internal drawing Line Font calibration' || inputs.stl_options_public && 'Public isolated STL options acceptance (bounded scope)' || inputs.stl_options_targeted && 'Isolated STL options calibration (not full acceptance)' || needs.native-profile.outputs.profile == 'tolerances-public' && 'Public document tolerance acceptance' || needs.native-profile.outputs.profile == 'tolerances-calibration' && 'Internal document tolerance calibration' || inputs.native_revolve_public && 'Bounded revolve public CLI acceptance' || inputs.native_revolve_calibration && 'Internal bounded revolve calibration' || 'Complete SOLIDWORKS functional verification' }}
    needs: [test, package, tag-policy, native-profile]
    if: ${{ always() && github.repository == 'YJBeetle/SWCLI' && needs.native-profile.result == 'success' && needs.test.result == 'success' && needs.package.result == 'success' && ((github.event_name == 'workflow_dispatch' && inputs.native_topology_targeted && !inputs.native_full && github.ref == 'refs/heads/codex/swcli-topology-references') || (github.event_name == 'workflow_dispatch' && (needs.native-profile.outputs.profile == 'full' || (github.ref == 'refs/heads/codex/docprops-tolerances' && (needs.native-profile.outputs.profile == 'tolerances-public' || needs.native-profile.outputs.profile == 'tolerances-calibration')))) || (github.event_name == 'workflow_dispatch' && (needs.native-profile.outputs.profile == 'image_quality_calibration' || needs.native-profile.outputs.profile == 'image_quality_public_acceptance')) || (github.event_name == 'workflow_dispatch' && (needs.native-profile.outputs.profile == 'line_font_public' || needs.native-profile.outputs.profile == 'line_font_calibration')) || (github.event_name == 'workflow_dispatch' && (needs.native-profile.outputs.profile == 'stl_options_public' || needs.native-profile.outputs.profile == 'stl_options_targeted')) || (github.event_name == 'workflow_dispatch' && (inputs.native_revolve_calibration || inputs.native_revolve_public) && github.ref == 'refs/heads/codex/swcli-revolve-feature') || (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && needs.tag-policy.result == 'success')) }}
    runs-on: windows-2025
    timeout-minutes: 120
    concurrency:
      group: ${{ (inputs.native_full && github.ref == 'refs/heads/codex/glb-export-repair' && format('swcli-glb-export-repair-{0}', github.ref)) || inputs.native_topology_targeted && format('swcli-topology-targeted-{0}', github.ref) || inputs.image_quality_calibration && format('swcli-image-quality-{0}', github.ref) || inputs.image_quality_public_acceptance && format('swcli-image-quality-public-{0}', github.ref) || inputs.line_font_public && format('swcli-line-font-public-{0}', github.ref) || inputs.line_font_calibration && format('swcli-line-font-calibration-{0}', github.ref) || inputs.stl_options_public && format('swcli-stl-options-public-{0}', github.ref) || inputs.stl_options_targeted && format('swcli-stl-options-{0}', github.ref) || startsWith(needs.native-profile.outputs.profile, 'tolerances-') && format('swcli-tolerance-calibration-{0}', github.ref) || inputs.native_revolve_public && format('swcli-revolve-public-{0}', github.ref) || inputs.native_revolve_calibration && format('swcli-revolve-calibration-{0}', github.ref) || (inputs.native_full && github.ref == 'refs/heads/codex/saveas3-modern' && format('swcli-saveas3-modern-{0}', github.ref)) || 'swcli-hosted-windows-solidworks' }}
      cancel-in-progress: false
    env:
      SWCLI_NATIVE_PROFILE: ${{ needs.native-profile.outputs.profile }}
      SW_MEDIA_PATH: ${{ inputs.media_path || 'Share/Software/DS.SolidWorks.2025.SP5.0.Premium-SSQ/SolidWorks.2025.SP5.0.Premium.DVD.iso' }}
      SW_ASSETS_PATH: ${{ inputs.assets_path || 'Share/Software/DS.SolidWorks.2025.SP5.0.Premium-SSQ/crack' }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Reject conflicting manual scopes
        if: ${{ (inputs.native_revolve_calibration && inputs.native_full) || (inputs.native_revolve_public && (inputs.native_full || inputs.native_revolve_calibration)) }}
        shell: powershell
        run: |
          throw "Choose exactly one native scope: full, internal revolve calibration, or public revolve acceptance"

      - name: Download built SWCLI distributions
        id: native_distribution
        uses: actions/download-artifact@v8
        with:
          name: swcli-dist
          path: ${{ runner.temp }}/swcli-dist
          digest-mismatch: error

      - name: Initialize private paths
        shell: powershell
        run: |
          "PROBE_ROOT=$env:RUNNER_TEMP\swcli-hosted-media" >> $env:GITHUB_ENV
          "PRIVATE_ROOT=$env:RUNNER_TEMP\swcli-private-runtime" >> $env:GITHUB_ENV
          "RCLONE_CONFIG_FILE=$env:RUNNER_TEMP\swcli-hosted-media\rclone.conf" >> $env:GITHUB_ENV
          "RCLONE_LOG_FILE=$env:RUNNER_TEMP\swcli-hosted-media\rclone.log" >> $env:GITHUB_ENV
          "RCLONE_CACHE_DIR=$env:RUNNER_TEMP\swcli-hosted-media\vfs-cache" >> $env:GITHUB_ENV
          "SWCLI_SMOKE_ROOT=$env:RUNNER_TEMP\swcli-native-smoke" >> $env:GITHUB_ENV

      - name: Measure disposable runner disk
        shell: powershell
        run: scripts/ci/windows/measure-runner.ps1 -OutputPath "$env:PROBE_ROOT\before.json"

      # Installation snapshots are disabled until fresh-runner native core
      # registration and equation behavior are proven equivalent to installation.
      - name: Free disposable runner disk for installation
        shell: powershell
        run: |
          $targetGiB = 48 + [Math]::Max(0, [int]"${{ inputs.vfs_cache_gib || '8' }}" - 8)
          scripts/ci/windows/free-space.ps1 -Profile "${{ inputs.cleanup_profile || 'auto' }}" -MinFreeGiB $targetGiB

      - name: Measure disk after runner cleanup
        shell: powershell
        run: scripts/ci/windows/measure-runner.ps1 -OutputPath "$env:PROBE_ROOT\after-cleanup.json"

      - name: Install rclone, WinFsp, and ImDisk
        id: media_tools
        shell: powershell
        run: |
          scripts/ci/windows/install-media-dependencies.ps1
          scripts/ci/windows/install-winfsp.ps1 -Directory "$env:PROBE_ROOT\winfsp"

      - name: Prepare protected Google Drive configuration
        id: private_config
        shell: powershell
        env:
          RCLONE_CONFIG_B64: ${{ secrets.RCLONE_CONFIG_B64 }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:RCLONE_CONFIG_B64)) {
            throw "Missing secret: RCLONE_CONFIG_B64"
          }
          New-Item -ItemType Directory -Force -Path $env:PROBE_ROOT | Out-Null
          [IO.File]::WriteAllBytes($env:RCLONE_CONFIG_FILE, [Convert]::FromBase64String($env:RCLONE_CONFIG_B64))
          if (-not (rclone --config $env:RCLONE_CONFIG_FILE listremotes | Select-String -SimpleMatch "gdrive:" -Quiet)) {
            throw "gdrive: remote is unavailable"
          }

      - name: Stream Google Drive through WinFsp
        id: drive_mount
        shell: powershell
        run: |
          $cacheBytes = [int64]${{ inputs.vfs_cache_gib || '8' }} * 1GB
          scripts/ci/windows/mount-google-drive.ps1 `
            -ConfigPath $env:RCLONE_CONFIG_FILE `
            -RemotePath "gdrive:" `
            -DriveLetter R `
            -CacheDirectory $env:RCLONE_CACHE_DIR `
            -CacheMaxBytes $cacheBytes `
            -LogPath $env:RCLONE_LOG_FILE `
            -PidPath "$env:PROBE_ROOT\rclone.pid"

      - name: Mount complete streamed ISO with ImDisk proxy
        id: iso_mount
        shell: powershell
        run: |
          scripts/ci/windows/probe-imdisk.ps1 `
            -ImagePath "R:\$env:SW_MEDIA_PATH" `
            -StateDirectory "$env:PROBE_ROOT\imdisk" `
            -DriveLetter S

      - name: Fetch private smoke-test runtime
        id: private_fetch
        shell: powershell
        run: |
          $assets = "$env:PRIVATE_ROOT\assets"
          New-Item -ItemType Directory -Force -Path $assets | Out-Null
          rclone --config $env:RCLONE_CONFIG_FILE copy "gdrive:$env:SW_ASSETS_PATH" $assets `
            --include "/SolidWorks_Flexnet_Server/**" `
            --include "/SOLIDWORKS Corp/SOLIDWORKS/**" `
            --include "/sw2025_network_serials_licensing.reg" `
            --exclude "*" `
            --transfers 4 `
            --checkers 8 `
            --log-level NOTICE
          foreach ($required in @(
            "$assets\sw2025_network_serials_licensing.reg",
            "$assets\SolidWorks_Flexnet_Server",
            "$assets\SOLIDWORKS Corp\SOLIDWORKS"
          )) {
            if (-not (Test-Path -LiteralPath $required)) { throw "Missing private test input: $required" }
          }

      - name: Install native SOLIDWORKS
        id: native_install
        shell: powershell
        run: |
          scripts/ci/windows/install-solidworks.ps1 `
            -MediaRoot $env:SW_MEDIA_ROOT `
            -LicensingRegistryFile "$env:PRIVATE_ROOT\assets\sw2025_network_serials_licensing.reg" `
            -LogDirectory "$env:PRIVATE_ROOT\install-logs" `
            -InventoryPath "$env:SWCLI_SMOKE_ROOT\vba-runtime.json"

      - name: Apply private runtime overlay and start test license service
        id: runtime_setup
        shell: powershell
        run: |
          scripts/ci/windows/prepare-test-runtime.ps1 `
            -AssetsRoot "$env:PRIVATE_ROOT\assets" `
            -StateDirectory "$env:PRIVATE_ROOT\state"

      - name: Select Python for internal calibration
        if: ${{ inputs.image_quality_calibration || inputs.image_quality_public_acceptance }}
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install internal GLB decoder
        if: ${{ inputs.image_quality_calibration || inputs.image_quality_public_acceptance }}
        shell: powershell
        run: |
          python -m pip install --only-binary=:all: "DracoPy==2.2.0" "numpy==2.2.6"
          if ($LASTEXITCODE -ne 0) { throw "Internal GLB decoder installation failed" }

      - name: Install built SWCLI wheel
        id: client_install
        shell: powershell
        run: |
          $wheels = @(Get-ChildItem -LiteralPath "$env:RUNNER_TEMP\swcli-dist" -Filter *.whl -File)
          if ($wheels.Count -ne 1) { throw "Expected exactly one SWCLI wheel from the package job" }
          python --version
          python -m pip install --upgrade pip
          if ($LASTEXITCODE -ne 0) { throw "pip upgrade failed" }
          python -m pip install $wheels[0].FullName
          if ($LASTEXITCODE -ne 0) { throw "SWCLI wheel installation failed" }
          python -I scripts/ci/verify-installed.py
          if ($LASTEXITCODE -ne 0) { throw "Installed SWCLI resources are invalid" }

      - name: Calibrate bounded revolve candidate (internal evidence only)
        id: revolve_calibration
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.native_revolve_calibration && !inputs.native_full && github.ref == 'refs/heads/codex/swcli-revolve-feature' }}
        timeout-minutes: 31
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path $env:SWCLI_SMOKE_ROOT | Out-Null
          python -I scripts/ci/verify-revolve-calibration.py `
            --output-dir "$env:SWCLI_SMOKE_ROOT\revolve-calibration" `
            --swconst "C:\Program Files\SOLIDWORKS\swconst.tlb" `
            --sldworks "C:\Program Files\SOLIDWORKS\sldworks.tlb"
          if ($LASTEXITCODE -ne 0) { throw "Revolve calibration failed; preserve original report and ZIP; no automatic retry" }

      - name: Verify native partial mutation with an internal observation fault
        id: revolve_partial_control
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.native_revolve_public && !inputs.native_revolve_calibration && !inputs.native_full && github.ref == 'refs/heads/codex/swcli-revolve-feature' }}
        timeout-minutes: 31
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path $env:SWCLI_SMOKE_ROOT | Out-Null
          python -I scripts/ci/verify-revolve-calibration.py `
            --output-dir "$env:SWCLI_SMOKE_ROOT\revolve-partial-control" `
            --swconst "C:\Program Files\SOLIDWORKS\swconst.tlb" `
            --sldworks "C:\Program Files\SOLIDWORKS\sldworks.tlb"
          if ($LASTEXITCODE -ne 0) { throw "Internal partial mutation control failed; preserve first error; no native retry" }

      - name: Verify bounded revolve through public CLI and daemon
        id: revolve_public
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.native_revolve_public && !inputs.native_revolve_calibration && !inputs.native_full && github.ref == 'refs/heads/codex/swcli-revolve-feature' }}
        timeout-minutes: 31
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path $env:SWCLI_SMOKE_ROOT | Out-Null
          python -I scripts/ci/verify-revolve-public.py --output-dir "$env:SWCLI_SMOKE_ROOT\revolve-public"
          if ($LASTEXITCODE -ne 0) { throw "Public revolve acceptance failed; preserve original evidence; no automatic retry" }

      - name: Calibrate isolated STL export options only
        id: stl_options_targeted
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.stl_options_targeted && !inputs.native_full && github.ref == 'refs/heads/codex/swcli-stl-export-options' }}
        timeout-minutes: 30
        shell: powershell
        run: |
          python -I scripts/ci/verify-stl-options.py `
            --output-dir "$env:SWCLI_SMOKE_ROOT\stl-options-targeted" `
            --swconst "C:\Program Files\SOLIDWORKS\swconst.tlb"
          if ($LASTEXITCODE -ne 0) { throw "STL options calibration failed; preserve original report, trace and files" }

      - name: Verify public STL options through installed CLI SDK MCP
        id: stl_options_public
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.stl_options_public && !inputs.native_full && !inputs.stl_options_targeted && github.ref == 'refs/heads/codex/swcli-stl-export-options' }}
        timeout-minutes: 30
        shell: powershell
        run: |
          python -m pip install "mcp>=1.30,<2" "Pillow>=10.4"
          if ($LASTEXITCODE -ne 0) { throw "Public MCP optional dependencies could not be installed" }
          python -I scripts/ci/verify-stl-options.py `
            --phase public `
            --output-dir "$env:SWCLI_SMOKE_ROOT\stl-options-public" `
            --swconst "C:\Program Files\SOLIDWORKS\swconst.tlb"
          if ($LASTEXITCODE -ne 0) { throw "Public STL options acceptance failed; preserve original receipts, trace and files" }

      - name: Verify public drawing Line Font CLI and daemon
        if: ${{ inputs.line_font_public && github.ref == 'refs/heads/codex/docprops-line-style' }}
        timeout-minutes: 30
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path $env:SWCLI_SMOKE_ROOT | Out-Null
          $template = & python -I scripts/ci/gate_support/drawing_template.py --program-data $env:ProgramData --installation "C:\Program Files\SOLIDWORKS"
          if ($LASTEXITCODE -ne 0) { throw "Drawing template discovery failed" }
          python -I scripts/ci/verify-line-font-public.py --output-dir "$env:SWCLI_SMOKE_ROOT\line-font-public" --drawing-template $template
          if ($LASTEXITCODE -ne 0) { throw "Public Line Font gate failed; retain report and native trace" }

      - name: Calibrate drawing line font defaults only
        if: ${{ inputs.line_font_calibration && github.ref == 'refs/heads/codex/docprops-line-style' }}
        timeout-minutes: 30
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path $env:SWCLI_SMOKE_ROOT | Out-Null
          $template = & python -I scripts/ci/gate_support/drawing_template.py --program-data $env:ProgramData --installation "C:\Program Files\SOLIDWORKS"
          if ($LASTEXITCODE -ne 0) { throw "Drawing template discovery failed" }
          python -I scripts/ci/verify-line-font-calibration.py --output-dir "$env:SWCLI_SMOKE_ROOT\line-font-calibration" --drawing-template $template
          if ($LASTEXITCODE -ne 0) { throw "Line font calibration failed; retain original report and trace" }

      - name: Prepare property fixtures for public CLI verification
        id: property_fixtures
        if: ${{ needs.native-profile.outputs.profile == 'full' }}
        timeout-minutes: 10
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path $env:SWCLI_SMOKE_ROOT | Out-Null
          python -I scripts/ci/verify-properties-calibration.py `
            --output-dir "$env:SWCLI_SMOKE_ROOT\properties-calibration" `
            --swconst "C:\Program Files\SOLIDWORKS\swconst.tlb"
          if ($LASTEXITCODE -ne 0) { throw "Property fixture preparation failed; see original report/trace" }

      - name: Prepare annotation fixtures for public CLI verification
        id: annotation_fixtures
        if: ${{ needs.native-profile.outputs.profile == 'full' || needs.native-profile.outputs.profile == 'tolerances-public' }}
        timeout-minutes: 10
        shell: powershell
        run: |
          $drawingTemplate = & python -I scripts/ci/gate_support/drawing_template.py --program-data $env:ProgramData --installation "C:\Program Files\SOLIDWORKS"
          if ($LASTEXITCODE -ne 0) { throw "Annotation drawing template discovery failed" }
          python -I scripts/ci/prepare-annotation-fixtures.py `
            --output-dir "$env:SWCLI_SMOKE_ROOT\annotation-fixtures" `
            --swconst "C:\Program Files\SOLIDWORKS\swconst.tlb" `
            --drawing-template $drawingTemplate
          if ($LASTEXITCODE -ne 0) { throw "Annotation fixture preparation failed; see original report/trace" }

      - name: Calibrate document default tolerances internally
        id: tolerance_calibration
        if: ${{ needs.native-profile.outputs.profile == 'tolerances-calibration' }}
        timeout-minutes: 31
        shell: powershell
        env:
          SWCLI_TRACE_NATIVE_CALLS: "1"
        run: |
          New-Item -ItemType Directory -Force -Path $env:SWCLI_SMOKE_ROOT | Out-Null
          $drawingTemplate = & python -I scripts/ci/gate_support/drawing_template.py --program-data $env:ProgramData --installation "C:\Program Files\SOLIDWORKS"
          if ($LASTEXITCODE -ne 0) { throw "Drawing template discovery failed" }
          python -I scripts/ci/verify-tolerance-calibration.py `
            --output-dir "$env:SWCLI_SMOKE_ROOT\tolerance-calibration" `
            --swconst "C:\Program Files\SOLIDWORKS\swconst.tlb" `
            --drawing-template $drawingTemplate
          if ($LASTEXITCODE -ne 0) { throw "Tolerance internal calibration failed; preserve first report/trace" }

      - name: Accept document default tolerances through public clients
        id: tolerance_acceptance
        if: ${{ needs.native-profile.outputs.profile == 'tolerances-public' }}
        timeout-minutes: 35
        shell: powershell
        run: |
          scripts/ci/windows/smoke-solidworks.ps1 -Workspace "$env:SWCLI_SMOKE_ROOT\tolerance-public" -Hidden -ToleranceFixtureDirectory "$env:SWCLI_SMOKE_ROOT\annotation-fixtures"

      - name: Verify installed modern API contracts without a CAD host
        id: modern_api_contract
        if: ${{ needs.native-profile.outputs.profile == 'full' && (github.ref == 'refs/heads/codex/saveas3-modern' || github.ref == 'refs/heads/codex/glb-export-repair') }}
        timeout-minutes: 10
        shell: powershell
        run: |
          python -I scripts/ci/verify-modern-api-contract.py --output-dir "$env:SWCLI_SMOKE_ROOT\modern-api-contract" --sldworks "C:\Program Files\SOLIDWORKS\sldworks.tlb" --swconst "C:\Program Files\SOLIDWORKS\swconst.tlb"
          if ($LASTEXITCODE -ne 0) { throw "Installed modern API contract verification failed; preserve first evidence" }

      - name: Run real SOLIDWORKS modeling and export smoke test
        id: native_tests
        if: ${{ needs.native-profile.outputs.profile == 'full' }}
        shell: powershell
        env:
          SWCLI_TRACE_NATIVE_CALLS: ${{ (github.ref == 'refs/heads/codex/saveas3-modern' || github.ref == 'refs/heads/codex/glb-export-repair') && '1' || '' }}
          SWCLI_TRACE_DEFINITION_INTERFACES: ${{ (github.ref == 'refs/heads/codex/saveas3-modern' || github.ref == 'refs/heads/codex/glb-export-repair') && '1' || '' }}
          SWCLI_PRESERVE_REJECTED_GLB: ${{ (github.ref == 'refs/heads/codex/saveas3-modern' || github.ref == 'refs/heads/codex/glb-export-repair') && '1' || '' }}
          SWCLI_GLB_RUNTIME_DIAGNOSTICS: ${{ github.ref == 'refs/heads/codex/glb-export-repair' && '1' || '' }}
          SWCLI_GLB_DIAGNOSTICS_SWCONST: 'C:\Program Files\SOLIDWORKS\swconst.tlb'
        run: |
          scripts/ci/windows/smoke-solidworks.ps1 -Workspace "$env:SWCLI_SMOKE_ROOT\visible" -VisibleSmoke
          scripts/ci/windows/smoke-solidworks.ps1 -Workspace "$env:SWCLI_SMOKE_ROOT\hidden" -Hidden -Suite full -PropertyFixtureDirectory "$env:SWCLI_SMOKE_ROOT\properties-calibration" -AnnotationFixtureDirectory "$env:SWCLI_SMOKE_ROOT\annotation-fixtures"

      - name: Run only internal image-quality GLB calibration
        id: image_quality_calibration
        if: ${{ inputs.image_quality_calibration }}
        timeout-minutes: 35
        shell: powershell
        run: |
          scripts/ci/windows/smoke-solidworks.ps1 -Workspace "$env:SWCLI_SMOKE_ROOT\image-quality" -Hidden -ImageQualityCalibration

      - name: Run only public document image-quality acceptance
        id: image_quality_public_acceptance
        if: ${{ inputs.image_quality_public_acceptance }}
        timeout-minutes: 35
        shell: powershell
        run: |
          scripts/ci/windows/smoke-solidworks.ps1 -Workspace "$env:SWCLI_SMOKE_ROOT\image-quality-public" -Hidden -ImageQualityPublicAcceptance

      - name: Run targeted topology reference calibration and public proof
        id: topology_targeted
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.native_topology_targeted && !inputs.native_full && github.ref == 'refs/heads/codex/swcli-topology-references' }}
        timeout-minutes: 65
        shell: powershell
        run: |
          python -I scripts/ci/run-topology-targeted.py `
            --output-dir "$env:SWCLI_SMOKE_ROOT\topology-targeted" `
            --swconst "C:\Program Files\SOLIDWORKS\swconst.tlb"
          if ($LASTEXITCODE -ne 0) { throw "Targeted topology proof failed; retain original report, traces and native files" }

      - name: Measure streamed data and remaining disk
        if: always()
        shell: powershell
        run: |
          scripts/ci/windows/measure-runner.ps1 -OutputPath "$env:PROBE_ROOT\after-smoke.json"
          $cacheBytes = (Get-ChildItem $env:RCLONE_CACHE_DIR -File -Recurse -ErrorAction SilentlyContinue |
            Measure-Object Length -Sum).Sum
          if ($null -eq $cacheBytes) { $cacheBytes = 0 }
          "Rclone VFS cache: {0:N2} GiB" -f ($cacheBytes / 1GB) |
            Tee-Object -FilePath "$env:PROBE_ROOT\cache-size.txt"

      - name: Upload private installer logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: swcli-install-logs-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}\swcli-private-runtime\install-logs
          if-no-files-found: ignore
          retention-days: 14

      - name: Remove private test inputs and stop services
        id: native_cleanup
        if: always()
        shell: powershell
        run: scripts/ci/windows/cleanup-hosted-solidworks.ps1 -PrivateRoot $env:PRIVATE_ROOT -ProbeRoot $env:PROBE_ROOT

      - name: Summarize public test evidence
        if: always()
        continue-on-error: true
        shell: powershell
        run: |
          $clientVersion = python -c "import sys; sys.path.insert(0, 'src'); import swcli; print(swcli.__version__)"
          if ("${{ inputs.stl_options_public }}" -eq "true") {
            python scripts/ci/summarize-tests.py `
              --evidence-root "$env:SWCLI_SMOKE_ROOT\stl-options-public" `
              --output-dir "$env:RUNNER_TEMP\swcli-test-summary" `
              --host windows --scope windows-stl-options-public-isolated `
              --source-commit "$env:GITHUB_SHA" --client-version "$clientVersion" `
              --stage "stl-options-public=${{ steps.stl_options_public.outcome }}" `
              --stage "cleanup=${{ steps.native_cleanup.outcome }}"
            exit $LASTEXITCODE
          }
          if ("${{ inputs.stl_options_targeted }}" -eq "true") {
            python scripts/ci/summarize-tests.py `
              --evidence-root "$env:SWCLI_SMOKE_ROOT\stl-options-targeted" `
              --output-dir "$env:RUNNER_TEMP\swcli-test-summary" `
              --host windows --scope windows-stl-options-internal-calibration `
              --source-commit "$env:GITHUB_SHA" --client-version "$clientVersion" `
              --stage "stl-options-internal=${{ steps.stl_options_targeted.outcome }}" `
              --stage "cleanup=${{ steps.native_cleanup.outcome }}"
            exit $LASTEXITCODE
          }
          if ($env:SWCLI_NATIVE_PROFILE -eq "native_topology_targeted") {
            python scripts/ci/summarize-tests.py `
              --evidence-root "$env:SWCLI_SMOKE_ROOT\topology-targeted" `
              --output-dir "$env:RUNNER_TEMP\swcli-test-summary" `
              --host windows --scope windows-targeted-topology-references `
              --source-commit "$env:GITHUB_SHA" --client-version "$clientVersion" `
              --stage "topology-targeted=${{ steps.topology_targeted.outcome }}" `
              --stage "cleanup=${{ steps.native_cleanup.outcome }}"
            exit $LASTEXITCODE
          }
          if ($env:SWCLI_NATIVE_PROFILE -ne "full") {
            "Targeted scope: $env:SWCLI_NATIVE_PROFILE; full_acceptance_eligible=false. See the selected original receipt."
            exit 0
          }
          if ("${{ inputs.native_revolve_calibration }}" -eq "true") {
            "Internal revolve calibration only; see revolve-calibration/report.json. Public acceptance is false."
            exit 0
          }
          if ("${{ inputs.native_revolve_public }}" -eq "true") {
            "Bounded revolve public acceptance only; see revolve-public/revolve-public.json; not complete full acceptance."
            exit 0
          }
          python scripts/ci/summarize-tests.py `
            --evidence-root "$env:RUNNER_TEMP\swcli-native-smoke" `
            --output-dir "$env:RUNNER_TEMP\swcli-test-summary" `
            --host windows --scope windows-installed-full `
            --source-commit "$env:GITHUB_SHA" --client-version "$clientVersion" `
            --stage "distributions=${{ steps.native_distribution.outcome }}" `
            --stage "media-tools=${{ steps.media_tools.outcome }}" `
            --stage "private-config=${{ steps.private_config.outcome }}" `
            --stage "drive-mount=${{ steps.drive_mount.outcome }}" `
            --stage "iso-mount=${{ steps.iso_mount.outcome }}" `
            --stage "private-fetch=${{ steps.private_fetch.outcome }}" `
            --stage "solidworks-install=${{ steps.native_install.outcome }}" `
            --stage "runtime-setup=${{ steps.runtime_setup.outcome }}" `
            --stage "client-install=${{ steps.client_install.outcome }}" `
            --stage "property-fixtures=${{ steps.property_fixtures.outcome }}" `
            --stage "annotation-fixtures=${{ steps.annotation_fixtures.outcome }}" `
            --stage "functional-tests=${{ steps.native_tests.outcome }}" `
            --stage "cleanup=${{ steps.native_cleanup.outcome }}"

      - name: Upload SWCLI-generated smoke evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: swcli-windows-hosted-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}\swcli-native-smoke
            ${{ runner.temp }}\swcli-test-summary\summary.json
            ${{ runner.temp }}\swcli-test-summary\summary.md
            ${{ runner.temp }}\swcli-hosted-media\*.json
            ${{ runner.temp }}\swcli-hosted-media\cache-size.txt
            ${{ runner.temp }}\swcli-hosted-media\winfsp\winfsp-install.log
          if-no-files-found: warn
          retention-days: 14


  detailing-calibration:
    needs: [native-profile]
    name: ${{ inputs.detailing_public_gate && 'Detailing public CLI/daemon gate' || 'Detailing internal calibration' }}
    if: ${{ github.repository == 'YJBeetle/SWCLI' && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/codex/docprops-detailing' && (inputs.detailing_calibration || inputs.detailing_public_gate) && !(inputs.detailing_calibration && inputs.detailing_public_gate) }}
    runs-on: windows-2025
    timeout-minutes: 120
    concurrency:
      group: swcli-detailing-calibration-${{ github.ref }}
      cancel-in-progress: false
    env:
      SW_MEDIA_PATH: Share/Software/DS.SolidWorks.2025.SP5.0.Premium-SSQ/SolidWorks.2025.SP5.0.Premium.DVD.iso
      SW_ASSETS_PATH: Share/Software/DS.SolidWorks.2025.SP5.0.Premium-SSQ/crack
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Install branch client and run associated portable tests
        shell: powershell
        run: |
          python -m pip install .
          if ($LASTEXITCODE -ne 0) { throw "Branch client install failed" }
          python -m unittest discover -s tests -p "*detailing*.py" -v
          if ($LASTEXITCODE -ne 0) { throw "Portable detailing tests failed" }
      - name: Initialize private paths
        shell: powershell
        run: |
          "PROBE_ROOT=$env:RUNNER_TEMP\swcli-hosted-media" >> $env:GITHUB_ENV
          "PRIVATE_ROOT=$env:RUNNER_TEMP\swcli-private-runtime" >> $env:GITHUB_ENV
          "RCLONE_CONFIG_FILE=$env:RUNNER_TEMP\swcli-hosted-media\rclone.conf" >> $env:GITHUB_ENV
          "RCLONE_LOG_FILE=$env:RUNNER_TEMP\swcli-hosted-media\rclone.log" >> $env:GITHUB_ENV
          "RCLONE_CACHE_DIR=$env:RUNNER_TEMP\swcli-hosted-media\vfs-cache" >> $env:GITHUB_ENV
          "SWCLI_SMOKE_ROOT=$env:RUNNER_TEMP\swcli-native-smoke" >> $env:GITHUB_ENV

      - name: Measure disposable runner disk
        shell: powershell
        run: scripts/ci/windows/measure-runner.ps1 -OutputPath "$env:PROBE_ROOT\before.json"

      # Installation snapshots are disabled until fresh-runner native core
      # registration and equation behavior are proven equivalent to installation.
      - name: Free disposable runner disk for installation
        shell: powershell
        run: |
          $targetGiB = 48 + [Math]::Max(0, [int]"8" - 8)
          scripts/ci/windows/free-space.ps1 -Profile "auto" -MinFreeGiB $targetGiB

      - name: Measure disk after runner cleanup
        shell: powershell
        run: scripts/ci/windows/measure-runner.ps1 -OutputPath "$env:PROBE_ROOT\after-cleanup.json"

      - name: Install rclone, WinFsp, and ImDisk
        id: media_tools
        shell: powershell
        run: |
          scripts/ci/windows/install-media-dependencies.ps1
          scripts/ci/windows/install-winfsp.ps1 -Directory "$env:PROBE_ROOT\winfsp"

      - name: Prepare protected Google Drive configuration
        id: private_config
        shell: powershell
        env:
          RCLONE_CONFIG_B64: ${{ secrets.RCLONE_CONFIG_B64 }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:RCLONE_CONFIG_B64)) {
            throw "Missing secret: RCLONE_CONFIG_B64"
          }
          New-Item -ItemType Directory -Force -Path $env:PROBE_ROOT | Out-Null
          [IO.File]::WriteAllBytes($env:RCLONE_CONFIG_FILE, [Convert]::FromBase64String($env:RCLONE_CONFIG_B64))
          if (-not (rclone --config $env:RCLONE_CONFIG_FILE listremotes | Select-String -SimpleMatch "gdrive:" -Quiet)) {
            throw "gdrive: remote is unavailable"
          }

      - name: Stream Google Drive through WinFsp
        id: drive_mount
        shell: powershell
        run: |
          $cacheBytes = [int64]8 * 1GB
          scripts/ci/windows/mount-google-drive.ps1 `
            -ConfigPath $env:RCLONE_CONFIG_FILE `
            -RemotePath "gdrive:" `
            -DriveLetter R `
            -CacheDirectory $env:RCLONE_CACHE_DIR `
            -CacheMaxBytes $cacheBytes `
            -LogPath $env:RCLONE_LOG_FILE `
            -PidPath "$env:PROBE_ROOT\rclone.pid"

      - name: Mount complete streamed ISO with ImDisk proxy
        id: iso_mount
        shell: powershell
        run: |
          scripts/ci/windows/probe-imdisk.ps1 `
            -ImagePath "R:\$env:SW_MEDIA_PATH" `
            -StateDirectory "$env:PROBE_ROOT\imdisk" `
            -DriveLetter S

      - name: Fetch private smoke-test runtime
        id: private_fetch
        shell: powershell
        run: |
          $assets = "$env:PRIVATE_ROOT\assets"
          New-Item -ItemType Directory -Force -Path $assets | Out-Null
          rclone --config $env:RCLONE_CONFIG_FILE copy "gdrive:$env:SW_ASSETS_PATH" $assets `
            --include "/SolidWorks_Flexnet_Server/**" `
            --include "/SOLIDWORKS Corp/SOLIDWORKS/**" `
            --include "/sw2025_network_serials_licensing.reg" `
            --exclude "*" `
            --transfers 4 `
            --checkers 8 `
            --log-level NOTICE
          foreach ($required in @(
            "$assets\sw2025_network_serials_licensing.reg",
            "$assets\SolidWorks_Flexnet_Server",
            "$assets\SOLIDWORKS Corp\SOLIDWORKS"
          )) {
            if (-not (Test-Path -LiteralPath $required)) { throw "Missing private test input: $required" }
          }

      - name: Install native SOLIDWORKS
        id: native_install
        shell: powershell
        run: |
          scripts/ci/windows/install-solidworks.ps1 `
            -MediaRoot $env:SW_MEDIA_ROOT `
            -LicensingRegistryFile "$env:PRIVATE_ROOT\assets\sw2025_network_serials_licensing.reg" `
            -LogDirectory "$env:PRIVATE_ROOT\install-logs" `
            -InventoryPath "$env:SWCLI_SMOKE_ROOT\vba-runtime.json"

      - name: Apply private runtime overlay and start test license service
        id: runtime_setup
        shell: powershell
        run: |
          scripts/ci/windows/prepare-test-runtime.ps1 `
            -AssetsRoot "$env:PRIVATE_ROOT\assets" `
            -StateDirectory "$env:PRIVATE_ROOT\state"

      - name: Run only the selected bounded detailing validation
        id: detailing
        timeout-minutes: 31
        shell: powershell
        env:
          SWCLI_TRACE_NATIVE_CALLS: "1"
        run: |
          $drawingTemplate = & python -I scripts/ci/gate_support/drawing_template.py --program-data $env:ProgramData --installation "C:\Program Files\SOLIDWORKS"
          if ($LASTEXITCODE -ne 0) { throw "Drawing fixture discovery failed" }
          $validationArguments = @("-I", "scripts/ci/run-detailing-calibration.py",
            "--output-dir", "$env:SWCLI_SMOKE_ROOT\detailing",
            "--swconst", "C:\Program Files\SOLIDWORKS\swconst.tlb",
            "--drawing-template", $drawingTemplate)
          if ("${{ inputs.detailing_public_gate }}" -eq "true") { $validationArguments += "--public-gate" }
          python @validationArguments
          if ($LASTEXITCODE -ne 0) { throw "Detailing validation failed; retain first-failure evidence" }
      - name: Retain original installer logs on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: swcli-detailing-install-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}\swcli-private-runtime\install-logs
          if-no-files-found: ignore
          retention-days: 14
      - name: Remove private test inputs and stop owned runner services
        if: always()
        shell: powershell
        run: scripts/ci/windows/cleanup-hosted-solidworks.ps1 -PrivateRoot $env:PRIVATE_ROOT -ProbeRoot $env:PROBE_ROOT
      - name: Retain original detailing validation evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: swcli-detailing-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}\swcli-native-smoke\detailing
          if-no-files-found: warn
          retention-days: 30


  font-scopes-calibration:
    needs: [native-profile, dispatch-policy]
    if: ${{ needs.dispatch-policy.outputs.validation_profile == 'font-scopes' && github.repository == 'YJBeetle/SWCLI' && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/codex/docprops-font-scopes' && inputs.calibrate_font_scopes }}
    uses: ./.github/workflows/font-scopes-calibration.yml
    with:
      calibrate_font_scopes: true
      font_scopes_profile: ${{ inputs.font_scopes_profile || 'internal' }}
    secrets:
      RCLONE_CONFIG_B64: ${{ secrets.RCLONE_CONFIG_B64 }}


  dimension-format:
    needs: [native-profile]
    if: ${{ github.repository == 'YJBeetle/SWCLI' && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/codex/docprops-dimension-format' && (inputs.dimension_format_calibration || inputs.dimension_format_public) }}
    runs-on: windows-2025
    timeout-minutes: 120
    concurrency:
      group: ${{ format('swcli-dimension-format-{0}-{1}', github.ref, inputs.dimension_format_public && 'public' || 'internal') }}
      cancel-in-progress: false
    env:
      SW_MEDIA_PATH: Share/Software/DS.SolidWorks.2025.SP5.0.Premium-SSQ/SolidWorks.2025.SP5.0.Premium.DVD.iso
      SW_ASSETS_PATH: Share/Software/DS.SolidWorks.2025.SP5.0.Premium-SSQ/crack
    steps:
      - name: Require exactly one dimension format mode
        if: ${{ inputs.dimension_format_calibration == inputs.dimension_format_public }}
        shell: powershell
        run: throw "Choose internal calibration or installed public acceptance, not both"
      - name: Check out exact selected head
        uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Initialize private paths
        shell: powershell
        run: |
          "PROBE_ROOT=$env:RUNNER_TEMP\swcli-hosted-media" >> $env:GITHUB_ENV
          "PRIVATE_ROOT=$env:RUNNER_TEMP\swcli-private-runtime" >> $env:GITHUB_ENV
          "RCLONE_CONFIG_FILE=$env:RUNNER_TEMP\swcli-hosted-media\rclone.conf" >> $env:GITHUB_ENV
          "RCLONE_LOG_FILE=$env:RUNNER_TEMP\swcli-hosted-media\rclone.log" >> $env:GITHUB_ENV
          "RCLONE_CACHE_DIR=$env:RUNNER_TEMP\swcli-hosted-media\vfs-cache" >> $env:GITHUB_ENV
          "SWCLI_SMOKE_ROOT=$env:RUNNER_TEMP\swcli-native-smoke" >> $env:GITHUB_ENV

      - name: Measure disposable runner disk
        shell: powershell
        run: scripts/ci/windows/measure-runner.ps1 -OutputPath "$env:PROBE_ROOT\before.json"

      # Installation snapshots are disabled until fresh-runner native core
      # registration and equation behavior are proven equivalent to installation.
      - name: Free disposable runner disk for installation
        shell: powershell
        run: |
          $targetGiB = 48 + [Math]::Max(0, [int]"8" - 8)
          scripts/ci/windows/free-space.ps1 -Profile "auto" -MinFreeGiB $targetGiB

      - name: Measure disk after runner cleanup
        shell: powershell
        run: scripts/ci/windows/measure-runner.ps1 -OutputPath "$env:PROBE_ROOT\after-cleanup.json"

      - name: Install rclone, WinFsp, and ImDisk
        id: media_tools
        shell: powershell
        run: |
          scripts/ci/windows/install-media-dependencies.ps1
          scripts/ci/windows/install-winfsp.ps1 -Directory "$env:PROBE_ROOT\winfsp"

      - name: Prepare protected Google Drive configuration
        id: private_config
        shell: powershell
        env:
          RCLONE_CONFIG_B64: ${{ secrets.RCLONE_CONFIG_B64 }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:RCLONE_CONFIG_B64)) {
            throw "Missing secret: RCLONE_CONFIG_B64"
          }
          New-Item -ItemType Directory -Force -Path $env:PROBE_ROOT | Out-Null
          [IO.File]::WriteAllBytes($env:RCLONE_CONFIG_FILE, [Convert]::FromBase64String($env:RCLONE_CONFIG_B64))
          if (-not (rclone --config $env:RCLONE_CONFIG_FILE listremotes | Select-String -SimpleMatch "gdrive:" -Quiet)) {
            throw "gdrive: remote is unavailable"
          }

      - name: Stream Google Drive through WinFsp
        id: drive_mount
        shell: powershell
        run: |
          $cacheBytes = [int64]8 * 1GB
          scripts/ci/windows/mount-google-drive.ps1 `
            -ConfigPath $env:RCLONE_CONFIG_FILE `
            -RemotePath "gdrive:" `
            -DriveLetter R `
            -CacheDirectory $env:RCLONE_CACHE_DIR `
            -CacheMaxBytes $cacheBytes `
            -LogPath $env:RCLONE_LOG_FILE `
            -PidPath "$env:PROBE_ROOT\rclone.pid"

      - name: Mount complete streamed ISO with ImDisk proxy
        id: iso_mount
        shell: powershell
        run: |
          scripts/ci/windows/probe-imdisk.ps1 `
            -ImagePath "R:\$env:SW_MEDIA_PATH" `
            -StateDirectory "$env:PROBE_ROOT\imdisk" `
            -DriveLetter S

      - name: Fetch private smoke-test runtime
        id: private_fetch
        shell: powershell
        run: |
          $assets = "$env:PRIVATE_ROOT\assets"
          New-Item -ItemType Directory -Force -Path $assets | Out-Null
          rclone --config $env:RCLONE_CONFIG_FILE copy "gdrive:$env:SW_ASSETS_PATH" $assets `
            --include "/SolidWorks_Flexnet_Server/**" `
            --include "/SOLIDWORKS Corp/SOLIDWORKS/**" `
            --include "/sw2025_network_serials_licensing.reg" `
            --exclude "*" `
            --transfers 4 `
            --checkers 8 `
            --log-level NOTICE
          foreach ($required in @(
            "$assets\sw2025_network_serials_licensing.reg",
            "$assets\SolidWorks_Flexnet_Server",
            "$assets\SOLIDWORKS Corp\SOLIDWORKS"
          )) {
            if (-not (Test-Path -LiteralPath $required)) { throw "Missing private test input: $required" }
          }

      - name: Install native SOLIDWORKS
        id: native_install
        shell: powershell
        run: |
          scripts/ci/windows/install-solidworks.ps1 `
            -MediaRoot $env:SW_MEDIA_ROOT `
            -LicensingRegistryFile "$env:PRIVATE_ROOT\assets\sw2025_network_serials_licensing.reg" `
            -LogDirectory "$env:PRIVATE_ROOT\install-logs" `
            -InventoryPath "$env:SWCLI_SMOKE_ROOT\vba-runtime.json"

      - name: Apply private runtime overlay and start test license service
        id: runtime_setup
        shell: powershell
        run: |
          scripts/ci/windows/prepare-test-runtime.ps1 `
            -AssetsRoot "$env:PRIVATE_ROOT\assets" `
            -StateDirectory "$env:PRIVATE_ROOT\state"

      - name: Install built SWCLI wheel
        id: client_install
        shell: powershell
        run: |
          python -m pip install build
          if ($LASTEXITCODE -ne 0) { throw "build installation failed" }
          python -m build --outdir "$env:RUNNER_TEMP\swcli-dist"
          if ($LASTEXITCODE -ne 0) { throw "wheel build failed" }
          $wheels = @(Get-ChildItem -LiteralPath "$env:RUNNER_TEMP\swcli-dist" -Filter *.whl -File)
          if ($wheels.Count -ne 1) { throw "Expected exactly one SWCLI wheel from the package job" }
          python --version
          python -m pip install --upgrade pip
          if ($LASTEXITCODE -ne 0) { throw "pip upgrade failed" }
          python -m pip install $wheels[0].FullName
          if ($LASTEXITCODE -ne 0) { throw "SWCLI wheel installation failed" }
          python -I scripts/ci/verify-installed.py
          if ($LASTEXITCODE -ne 0) { throw "Installed SWCLI resources are invalid" }

      - name: Calibrate dimension display only
        if: ${{ inputs.dimension_format_calibration && !inputs.dimension_format_public }}
        id: calibration
        timeout-minutes: 31
        shell: powershell
        env:
          SWCLI_TRACE_NATIVE_CALLS: "1"
        run: |
          New-Item -ItemType Directory -Force -Path $env:SWCLI_SMOKE_ROOT | Out-Null
          $drawingTemplate = & python -I scripts/ci/gate_support/drawing_template.py --program-data $env:ProgramData --installation "C:\Program Files\SOLIDWORKS"
          if ($LASTEXITCODE -ne 0) { throw "Explicit drawing template discovery failed" }
          python -I scripts/ci/verify-dimension-format-calibration.py `
            --output-dir "$env:SWCLI_SMOKE_ROOT\dimension-format" `
            --swconst "C:\Program Files\SOLIDWORKS\swconst.tlb" `
            --drawing-template $drawingTemplate
          if ($LASTEXITCODE -ne 0) { throw "Dimension display calibration failed; inspect original report/trace" }
      - name: Prepare independent public dimension format fixtures
        if: ${{ inputs.dimension_format_public && !inputs.dimension_format_calibration }}
        timeout-minutes: 10
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path $env:SWCLI_SMOKE_ROOT | Out-Null
          $drawingTemplate = & python -I scripts/ci/gate_support/drawing_template.py --program-data $env:ProgramData --installation "C:\Program Files\SOLIDWORKS"
          if ($LASTEXITCODE -ne 0) { throw "Explicit public drawing template discovery failed" }
          python -I scripts/ci/prepare-annotation-fixtures.py `
            --output-dir "$env:SWCLI_SMOKE_ROOT\dimension-public-fixtures" `
            --swconst "C:\Program Files\SOLIDWORKS\swconst.tlb" --drawing-template $drawingTemplate
          if ($LASTEXITCODE -ne 0) { throw "Independent dimension format fixture preparation failed" }
      - name: Verify installed public dimension format CLI and daemon
        if: ${{ inputs.dimension_format_public && !inputs.dimension_format_calibration }}
        timeout-minutes: 30
        shell: powershell
        run: |
          scripts/ci/windows/smoke-solidworks.ps1 -Workspace "$env:SWCLI_SMOKE_ROOT\dimension-public" -Hidden -Suite core `
            -DimensionFormatFixtureDirectory "$env:SWCLI_SMOKE_ROOT\dimension-public-fixtures"
      - name: Clean private inputs
        if: always()
        shell: powershell
        run: scripts/ci/windows/cleanup-hosted-solidworks.ps1 -PrivateRoot $env:PRIVATE_ROOT -ProbeRoot $env:PROBE_ROOT
      - name: Upload original calibration evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dimension-format-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/swcli-native-smoke
          if-no-files-found: warn
          retention-days: 14

  release:
    name: Publish original verified version-tag artifacts
    needs: [tag-policy, test, package, solidworks-e2e]
    if: ${{ github.repository == 'YJBeetle/SWCLI' && github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && needs.tag-policy.result == 'success' && needs.test.result == 'success' && needs.package.result == 'success' && needs.solidworks-e2e.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      actions: read
    concurrency:
      group: swcli-release-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Resolve artifacts from successful native execution
        id: release-source
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/ci/tag-release.py resolve-artifacts
      - name: Download original distributions from this run
        uses: actions/download-artifact@v8
        with:
          artifact-ids: ${{ steps.release-source.outputs.dist_id }}
          path: ${{ runner.temp }}/release-dist
          digest-mismatch: error
      - name: Download original native receipts from this run
        uses: actions/download-artifact@v8
        with:
          artifact-ids: ${{ steps.release-source.outputs.native_id }}
          path: ${{ runner.temp }}/release-native
          digest-mismatch: error
      - name: Verify source, original artifacts and full native proof; publish without replacing assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          python scripts/ci/tag-release.py release \
            --dist "${{ runner.temp }}/release-dist" \
            --evidence "${{ runner.temp }}/release-native/swcli-native-smoke" \
            --output "${{ runner.temp }}/release-assets" \
            | tee "${{ runner.temp }}/release-public-verification.json"
      - name: Retain publication and anonymous-download verification receipt
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: swcli-release-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/release-assets
            ${{ runner.temp }}/release-public-verification.json
          if-no-files-found: warn
          retention-days: 90
