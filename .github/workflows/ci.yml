name: Build and unit tests

on:
  push:
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.gitignore'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Windows / Python ${{ matrix.python }}
    runs-on: windows-2025
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ["3.9", "3.14"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: Install SWCLI
        shell: powershell
        run: |
          python -m pip install --upgrade pip
          python -m pip install --editable ".[windows]"

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Parse Windows CI scripts
        shell: powershell
        run: |
          $failed = $false
          Get-ChildItem scripts/ci/windows -Filter *.ps1 | ForEach-Object {
            $tokens = $null
            $errors = $null
            [Management.Automation.Language.Parser]::ParseFile(
              $_.FullName,
              [ref]$tokens,
              [ref]$errors
            ) | Out-Null
            if ($errors.Count -gt 0) {
              $failed = $true
              $errors | ForEach-Object {
                Write-Error "$($_.Extent.File):$($_.Extent.StartLineNumber): $($_.Message)"
              }
            }
          }
          if ($failed) { throw "PowerShell parser rejected one or more Windows CI scripts" }

      - name: Verify installed commands and schemas
        shell: powershell
        run: |
          sw-cli version --json
          sw-cli protocol show request | ConvertFrom-Json | Out-Null
          sw-cli protocol show response | ConvertFrom-Json | Out-Null

  package:
    name: Build wheel
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip

      - name: Build and inspect distributions
        shell: bash
        run: |
          set -Eeuo pipefail
          python -m pip install --upgrade build twine
          python -m build
          python -m twine check dist/*

      - name: Upload distributions
        uses: actions/upload-artifact@v7
        with:
          name: swcli-dist
          path: dist/
          if-no-files-found: error
          retention-days: 14
