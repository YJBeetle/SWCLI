name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Windows / Python ${{ matrix.python }}
    runs-on: windows-2025
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ["3.9", "3.14"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: Install SWCLI
        shell: powershell
        run: |
          python -m pip install --upgrade pip
          python -m pip install --editable ".[windows]"

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Verify installed commands and schemas
        shell: powershell
        run: |
          sw-cli version --json
          sw-cli protocol show request > request.schema.json
          sw-cli protocol show response > response.schema.json
          python -m json.tool request.schema.json > $null
          python -m json.tool response.schema.json > $null

  package:
    name: Build wheel
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip

      - name: Build and inspect distributions
        shell: bash
        run: |
          set -Eeuo pipefail
          python -m pip install --upgrade build twine
          python -m build
          python -m twine check dist/*

      - name: Upload distributions
        uses: actions/upload-artifact@v7
        with:
          name: swcli-dist
          path: dist/
          if-no-files-found: error
          retention-days: 14
