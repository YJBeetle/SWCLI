name: Native Windows SOLIDWORKS smoke test

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: swcli-native-windows-solidworks
  cancel-in-progress: false

jobs:
  smoke:
    name: Model and export on native Windows
    runs-on: [self-hosted, windows, x64, solidworks-2025]
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          clean: true

      - name: Initialize smoke workspace
        shell: powershell
        run: |
          "SWCLI_SMOKE_ROOT=$env:RUNNER_TEMP\swcli-native-smoke-${{ github.run_id }}-${{ github.run_attempt }}" >> $env:GITHUB_ENV

      - name: Verify interactive Windows runner
        shell: powershell
        run: scripts/ci/windows/assert-interactive-session.ps1

      - name: Install current SWCLI checkout
        shell: powershell
        run: |
          python --version
          python -m pip install --upgrade pip
          python -m pip install --editable ".[windows]"

      - name: Run native SOLIDWORKS modeling smoke test
        shell: powershell
        run: scripts/ci/windows/smoke-solidworks.ps1 -Workspace $env:SWCLI_SMOKE_ROOT

      - name: Upload native smoke evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: swcli-native-windows-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}\swcli-native-smoke-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: error
          retention-days: 14
